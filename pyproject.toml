[project]
name = "deauville-festival"
version = "1.0.0"
description = "Programme and scheduling for the Deauville Festival du Rire"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
deauville = "deauville.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deauville"]

[tool.setuptools.data-files]
"share/deauville/data" = ["data/festival.json"]
"share/deauville/web/public" = ["web/public/*.html", "web/public/*.css", "web/public/*.js"]
"share/deauville/web/admin" = ["web/admin/*.html", "web/admin/*.css", "web/admin/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
